# Production docker-compose.yml
# Nginx reverse proxy on port 80 (standard HTTP, typically allowed by corporate firewalls)

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: portal-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_project_fo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: portal-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=portal_project_fo
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/sql:/app/sql
      - ./backend/.env:/app/.env
      - portal-uploads:/app/uploads
    command: node src/server.prod.js

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: portal-frontend
    restart: unless-stopped
    expose:
      - "5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
    environment:
      - VITE_API_URL=http://localhost:5000
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
  portal-uploads:
