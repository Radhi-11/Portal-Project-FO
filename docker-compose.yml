# Development docker-compose.yml
# For full development with Docker, use docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: portal-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_project_fo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: portal-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=portal_project_fo
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/sql:/app/sql
      - ./backend/.env:/app/.env
      - portal-uploads:/app/uploads
    command: npm run dev:mem

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: portal-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
    environment:
      - VITE_API_URL=http://localhost:5000
    command: npm run dev
    depends_on:
      - backend

volumes:
  postgres-data:
  portal-uploads:
